[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater-robot"
version = "0.2.0"
description = "Reusable hydrodynamic dynamics, control, and simulation tools for underwater robots."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shucheng Zhang"}]
keywords = [
    "robotics",
    "underwater robot",
    "marine robotics",
    "hydrodynamics",
    "simulation",
    "bio-inspired robot",
    "AUV",
    "oscillating fins",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "examples"]
